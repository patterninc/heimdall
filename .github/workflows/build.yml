name: Build and Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          # setup-go caches the module + build cache keyed on go.sum by default.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          # Gets node version from web/.nvmrc and pnpm version from `packageManager` in web/package.json
          working-directory: web
          cache: true
          install: false # build.sh runs the install

      - name: Build and Test
        run: ./build.sh --go --ui --test
