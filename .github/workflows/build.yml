name: Build and Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          # setup-go caches the module + build cache keyed on go.sum by default.
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          # pnpm and Node versions come from web/package.json `packageManager` and web/.nvmrc
          working-directory: web
          cache: true
          # build.sh runs the install
          install: false
      - name: Build and Test
        run: ./build.sh --go --ui --test
